# ECOD platform - Netlify configuration
# Static SPA + a single serverless API function. No bundler or client build step is required.
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'ECOD: no client build required'"

[build.environment]
  NODE_VERSION = "24"

# Review builds use their own Blobs store and synthetic accounts.
[context.deploy-preview]
  command = "node scripts/seed-preview.mjs"
  [context.deploy-preview.environment]
    STORAGE = "blobs"
    BLOBS_REQUIRE_CONSISTENCY = "true"

[functions]
  node_bundler = "esbuild"

# Keep browser-facing responses locked down without adding a CSP that would
# prevent the zero-build SPA from using its module scripts and inline widgets.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Modules and styles have stable URLs, so reloads must revalidate them.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
