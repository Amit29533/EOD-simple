  <link rel="stylesheet" href="/styles.css" />
  <script>
    /* Set the colour theme before first paint so there is no flash. Mirrors js/theme.js. */
    (function () {
      try {
        var pref = localStorage.getItem('anthroprime-ecod-theme');
        if (['auto', 'light', 'dark'].indexOf(pref) === -1) pref = 'auto';
        var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.dataset.themePref = pref;
        root.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) { /* storage blocked — fall back to light */ }
    })();
  </script>
