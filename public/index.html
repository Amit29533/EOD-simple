<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#eef6f7" />
  <meta name="color-scheme" content="light dark" />
  <title>Anthroprime ECOD · Enterprise Capability on Demand</title>
  <meta name="description" content="Anthroprime ECOD — assess, enrich and certify enterprise-ready technology talent." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  <link rel="apple-touch-icon" href="/brand/icon-192.png" />
  <meta property="og:image" content="/brand/logo.png" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    /* Set the colour theme before first paint so there is no flash. Mirrors js/theme.js. */
    (function () {
      try {
        var pref = localStorage.getItem('anthroprime-ecod-theme');
        if (['auto', 'light', 'dark'].indexOf(pref) === -1) pref = 'auto';
        var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.dataset.themePref = pref;
        root.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) { /* storage blocked — fall back to light */ }
    })();
  </script>
</head>

</body>
